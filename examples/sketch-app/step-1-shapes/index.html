<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Small Sketchbook</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #dfe3e6;
      --chrome: #f7f7f4;
      --paper: #fffef9;
      --ink: #17202a;
      --muted: #68717b;
      --line: #c9ced2;
      --active: #222d39;
      --active-ink: #ffffff;
      --shadow: 0 18px 48px rgba(26, 34, 43, .15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191c;
        --chrome: #24272c;
        --paper: #f7f3e8;
        --ink: #f5f4ef;
        --muted: #b3b5b8;
        --line: #42464e;
        --active: #e7e5df;
        --active-ink: #1b1c1f;
        --shadow: 0 18px 48px rgba(0, 0, 0, .35);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid #6d62d6; outline-offset: 2px; }
    .app { width: min(1440px, calc(100% - 20px)); margin: 0 auto; padding: 10px 0 24px; }
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--chrome); box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 9px; margin-right: auto; font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 800; }
    .brand-mark { width: 30px; height: 30px; border: 2px solid currentColor; border-radius: 50% 50% 46% 54%; transform: rotate(-8deg); }
    .tool-group { display: flex; align-items: center; gap: 5px; padding-left: 8px; border-left: 1px solid var(--line); }
    .tool, .action { min-height: 36px; border: 1px solid transparent; border-radius: 9px; padding: 7px 10px; background: transparent; }
    .tool:hover, .action:hover:not(:disabled) { background: color-mix(in srgb, var(--chrome) 65%, var(--line)); }
    .tool[aria-pressed="true"] { background: var(--active); color: var(--active-ink); }
    .action:disabled { cursor: not-allowed; opacity: .35; }
    .color-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .76rem; }
    input[type="color"] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: transparent; }
    .size-group { display: flex; gap: 4px; }
    .size { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 9px; background: transparent; }
    .size span { display: block; border-radius: 999px; background: currentColor; }
    .size[data-size="2"] span { width: 4px; height: 4px; }
    .size[data-size="6"] span { width: 8px; height: 8px; }
    .size[data-size="14"] span { width: 14px; height: 14px; }
    .size[aria-pressed="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--chrome) 55%, var(--line)); }
    .stage { position: relative; margin-top: 10px; padding: clamp(10px, 3vw, 36px); border-radius: 20px; background: color-mix(in srgb, var(--bg) 86%, #727980); }
    .paper { position: relative; width: min(100%, 1200px); margin: 0 auto; overflow: hidden; border-radius: 3px; background: var(--paper); box-shadow: 0 18px 50px rgba(11, 16, 22, .22); aspect-ratio: 5 / 3; }
    .paper::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .32;
      background-image: linear-gradient(#c8c2b4 1px, transparent 1px), linear-gradient(90deg, #c8c2b4 1px, transparent 1px);
      background-size: 32px 32px;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .statusbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 10px 4px 0; color: var(--muted); font-size: .72rem; }
    .shortcut-help { text-align: right; }
    .back { color: inherit; }
    @media (max-width: 760px) {
      .brand { width: 100%; }
      .tool-group { padding-left: 0; border-left: 0; }
      .label-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
      .stage { padding: 8px; }
      .shortcut-help { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="toolbar" aria-label="Drawing tools">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Small Sketchbook</div>
      <div class="tool-group">
        <button class="tool" id="penTool" type="button" aria-pressed="true" title="Pen (P)">✎ <span class="label-text">Pen</span></button>
        <button class="tool" id="eraserTool" type="button" aria-pressed="false" title="Eraser (E)">⌫ <span class="label-text">Eraser</span></button>
      </div>
      <div class="tool-group size-group" aria-label="Stroke size">
        <button class="size" type="button" data-size="2" aria-pressed="false" aria-label="Fine stroke"><span></span></button>
        <button class="size" type="button" data-size="6" aria-pressed="true" aria-label="Medium stroke"><span></span></button>
        <button class="size" type="button" data-size="14" aria-pressed="false" aria-label="Broad stroke"><span></span></button>
      </div>
      <div class="tool-group">
        <label class="color-label" for="strokeColor"><span class="label-text">Ink</span><input id="strokeColor" type="color" value="#253047" aria-label="Ink color"></label>
      </div>
      <div class="tool-group">
        <button class="action" id="undoButton" type="button" disabled title="Undo (Ctrl/⌘ Z)">↶ <span class="label-text">Undo</span></button>
        <button class="action" id="redoButton" type="button" disabled title="Redo (Ctrl/⌘ Shift Z)">↷ <span class="label-text">Redo</span></button>
        <button class="action" id="clearButton" type="button">Clear</button>
        <button class="action" id="exportButton" type="button">Export PNG</button>
      </div>
    </nav>

    <section class="stage" aria-label="Sketching area">
      <div class="paper">
        <canvas id="drawingCanvas" width="1200" height="720" aria-label="Drawing canvas. Use a pointer or touch to sketch."></canvas>
      </div>
      <div class="statusbar">
        <span id="status" role="status" aria-live="polite">A clean page is ready.</span>
        <span class="shortcut-help">P pen · E eraser · Ctrl/⌘ Z undo · Shift + Ctrl/⌘ Z redo</span>
        <a class="back" href="../index.html">All examples</a>
      </div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "owl-small-sketchbook-v1";
      const canvas = document.getElementById("drawingCanvas");
      const context = canvas.getContext("2d", { alpha: true });
      const status = document.getElementById("status");
      const penTool = document.getElementById("penTool");
      const eraserTool = document.getElementById("eraserTool");
      const colorInput = document.getElementById("strokeColor");
      const undoButton = document.getElementById("undoButton");
      const redoButton = document.getElementById("redoButton");

      let strokes = [];
      let redoStack = [];
      let activeStroke = null;
      let tool = "pen";
      let size = 6;

      const setStatus = (message) => { status.textContent = message; };

      const drawStroke = (target, stroke) => {
        if (!stroke.points.length) return;
        target.save();
        target.globalCompositeOperation = stroke.tool === "eraser" ? "destination-out" : "source-over";
        target.strokeStyle = stroke.color;
        target.lineWidth = stroke.size;
        target.lineCap = "round";
        target.lineJoin = "round";
        target.beginPath();
        const first = stroke.points[0];
        target.moveTo(first.x, first.y);
        if (stroke.points.length === 1) {
          target.lineTo(first.x + 0.01, first.y + 0.01);
        } else {
          for (let index = 1; index < stroke.points.length; index += 1) {
            const previous = stroke.points[index - 1];
            const point = stroke.points[index];
            const middleX = (previous.x + point.x) / 2;
            const middleY = (previous.y + point.y) / 2;
            target.quadraticCurveTo(previous.x, previous.y, middleX, middleY);
          }
          const last = stroke.points[stroke.points.length - 1];
          target.lineTo(last.x, last.y);
        }
        target.stroke();
        target.restore();
      };

      const redraw = () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
        strokes.forEach((stroke) => drawStroke(context, stroke));
        updateHistoryButtons();
      };

      const save = () => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ strokes }));
          setStatus(`${strokes.length} stroke${strokes.length === 1 ? "" : "s"} · saved locally`);
        } catch (error) {
          setStatus("Local save is unavailable. Export a PNG to keep this page.");
        }
      };

      const load = () => {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (stored && Array.isArray(stored.strokes)) {
            strokes = stored.strokes.filter((stroke) => Array.isArray(stroke.points));
            if (strokes.length) setStatus(`${strokes.length} saved strokes restored.`);
          }
        } catch (error) {
          setStatus("The saved sketch could not be restored; a clean page is ready.");
        }
      };

      const updateHistoryButtons = () => {
        undoButton.disabled = strokes.length === 0;
        redoButton.disabled = redoStack.length === 0;
      };

      const setTool = (nextTool) => {
        tool = nextTool;
        penTool.setAttribute("aria-pressed", String(tool === "pen"));
        eraserTool.setAttribute("aria-pressed", String(tool === "eraser"));
        canvas.style.cursor = tool === "eraser" ? "cell" : "crosshair";
        setStatus(tool === "pen" ? "Pen selected." : "Eraser selected.");
      };

      const pointFromEvent = (event) => {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height),
          pressure: event.pressure > 0 ? event.pressure : 0.5
        };
      };

      const beginStroke = (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        event.preventDefault();
        canvas.setPointerCapture(event.pointerId);
        const point = pointFromEvent(event);
        activeStroke = {
          tool,
          color: colorInput.value,
          size: tool === "eraser" ? size * 2.4 : Math.max(1, size * (0.7 + point.pressure * 0.6)),
          points: [point]
        };
        drawStroke(context, activeStroke);
      };

      const moveStroke = (event) => {
        if (!activeStroke) return;
        event.preventDefault();
        activeStroke.points.push(pointFromEvent(event));
        redraw();
        drawStroke(context, activeStroke);
      };

      const endStroke = (event) => {
        if (!activeStroke) return;
        event.preventDefault();
        activeStroke.points.push(pointFromEvent(event));
        strokes.push(activeStroke);
        activeStroke = null;
        redoStack = [];
        redraw();
        save();
      };

      const undo = () => {
        if (!strokes.length) return;
        redoStack.push(strokes.pop());
        redraw();
        save();
      };

      const redo = () => {
        if (!redoStack.length) return;
        strokes.push(redoStack.pop());
        redraw();
        save();
      };

      const exportPng = () => {
        const inkLayer = document.createElement("canvas");
        inkLayer.width = canvas.width;
        inkLayer.height = canvas.height;
        const inkContext = inkLayer.getContext("2d");
        strokes.forEach((stroke) => drawStroke(inkContext, stroke));
        const output = document.createElement("canvas");
        output.width = canvas.width;
        output.height = canvas.height;
        const outputContext = output.getContext("2d");
        outputContext.fillStyle = "#fffef9";
        outputContext.fillRect(0, 0, output.width, output.height);
        outputContext.drawImage(inkLayer, 0, 0);
        const link = document.createElement("a");
        link.download = "small-sketchbook.png";
        link.href = output.toDataURL("image/png");
        link.click();
        setStatus("PNG exported.");
      };

      canvas.addEventListener("pointerdown", beginStroke);
      canvas.addEventListener("pointermove", moveStroke);
      canvas.addEventListener("pointerup", endStroke);
      canvas.addEventListener("pointercancel", () => { activeStroke = null; redraw(); });
      penTool.addEventListener("click", () => setTool("pen"));
      eraserTool.addEventListener("click", () => setTool("eraser"));
      document.querySelectorAll(".size").forEach((button) => {
        button.addEventListener("click", () => {
          size = Number(button.dataset.size);
          document.querySelectorAll(".size").forEach((candidate) => candidate.setAttribute("aria-pressed", String(candidate === button)));
          setStatus(`${size === 2 ? "Fine" : size === 6 ? "Medium" : "Broad"} stroke selected.`);
        });
      });
      undoButton.addEventListener("click", undo);
      redoButton.addEventListener("click", redo);
      document.getElementById("clearButton").addEventListener("click", () => {
        if (!strokes.length || !confirm("Clear every stroke from this page?")) return;
        redoStack = [...strokes].reverse();
        strokes = [];
        redraw();
        save();
      });
      document.getElementById("exportButton").addEventListener("click", exportPng);
      window.addEventListener("keydown", (event) => {
        const modifier = event.ctrlKey || event.metaKey;
        if (modifier && event.key.toLowerCase() === "z") {
          event.preventDefault();
          event.shiftKey ? redo() : undo();
        } else if (!modifier && !event.altKey && event.key.toLowerCase() === "p") {
          setTool("pen");
        } else if (!modifier && !event.altKey && event.key.toLowerCase() === "e") {
          setTool("eraser");
        }
      });

      load();
      redraw();
    })();
  </script>
</body>
</html>
